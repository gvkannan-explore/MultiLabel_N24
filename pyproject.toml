[project]
name = "mmclf-n24"
version = "0.1.0"
description = "Train Multi-modal News-classification model using lightning, transformers and timm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1",
    "datasets>=3",
    "numpy>=2.1.3",
    "pandas>=3.1.0",
    "pillow>=11.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=4.46.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
    "tqdm>=4.67.0",
]
lint = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "pyright>=1.1.414",
    "ruff>=0.7.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
include = ["src/**/*.py", "scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
# The git-ignored datasets/ data folder would otherwise make the datasets
# library sort as first-party in checkouts that have the folder.
known-third-party = ["datasets"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "scripts", "tests"]
