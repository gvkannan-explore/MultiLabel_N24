[project]
name = "mmclf-n24"
version = "0.1.0"
description = "Train Multi-modal News-classification model using lightning, transformers and timm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
]
lint = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pyright>=1.1.414",
    "ruff>=0.17.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
include = ["src/**/*.py", "scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
# The git-ignored datasets/ data folder would otherwise make the datasets
# library sort as first-party in checkouts that have the folder.
known-third-party = ["datasets"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "scripts", "tests"]
