[project]
name = "mmclf-n24"
version = "0.1.0"
description = "Train Multi-modal News-classification model using lightning, transformers and timm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.3",
    "pandas>=3.1.0",
    "pillow>=11.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=4.46.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
    "tqdm>=4.67.0",
]
lint = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "ruff>=0.7.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
